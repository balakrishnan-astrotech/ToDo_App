  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  
  <div class="side-nav">
    <nav class="menu">
    <span></span>
    <span></span>

    <div class="side-menu">
      <div class="menu-list">
        <ul>
          <li><i class="fa-solid fa-home"></i><a href="index.html">Home</a></li>
          <li><i class="fa-solid fa-tasks"></i><a href="task-manager.html">Task Manager</a></li>

  <header>
    <h1>ToDo App</h1>
    <p>Organize your tasks and stay productive.</p>
  </header>
  <main>
    <section class="add-task">

      <h2>Add New Task</h2>

      <form id="task-form">

        <label for="task">Task Name<sup style="color: red; font-weight: 400;">*</sup></label>
        <input type="text" id="task" name="task" placeholder="Enter your task" required>
        <label for="status">Status<sup style="color: red; font-weight: 400;">*</sup></label>
        <select id="status" name="status" required>
          <option>Not Started</option>
          <option>Ongoing</option>
          <option>Completed</option>
        </select>

        <label for="date">Date<sup style="color: red; font-weight: 400;">*</sup></label>
        <input type="date" id="date" name="date" required>

        <label for="priority">Priority<sup style="color: red; font-weight: 400;">*</sup></label>
        <select id="priority" name="priority" required>
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>
        <label for="description">Description</label>
        <textarea type="text" id="description" placeholder="A brief descirption about task" default="No description"></textarea>
        <button type="submit">Add Task</button>

      </form>

    </section>

    <section class="tasks">

      <h2>My Tasks</h2>

      <div class="task-list"></div>

    </section>

  </main>
  <script type="module" src="js/auth.js"></script>
<script src="js/main.js" type="module"></script>

</body>

</html>
