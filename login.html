<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="css/auth.css">
</head>

<body>
<header class="authhead">
  <h1>ToDo App</h1>
  <small>Your personal task manager!</small>
</header>
  <div class="auth-container">
      
        <h1>Welcome Back</h1>
        <form id="login-form">
<lable for="login-email">Email</lable>
            <input
                type="email"
                id="login-email"
                placeholder="Your Email address"
                required
            >

          <lable for="login-password">Password</lable>
            <input
                type="password"
                id="login-password"
                placeholder="Your Password"
                required
            >

            <button type="submit">Login</button>

        </form>

        <button type="button" id="forgot-password">
            Forgot Password?
        </button>

        <p id="auth-message"></p>

        <p>
            Don't have an account?
            <a href="register.html">Register</a>
        </p>

    </div>

    <script type="module" src="js/auth.js"></script>

</body>
</html>
