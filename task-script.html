<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToDo – Task Script</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="icon" href="images/ToDo_logo.png">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div class="side-nav">
    <nav class="menu">
      <span></span>
      <span></span>
      <span></span>
    </nav>
    <div class="side-menu">
      <div class="menu-list">
        <ul>
          <li><i class="fa-solid fa-home"></i><a href="index.html">Home</a></li>
          <li><i class="fa-solid fa-tasks"></i><a href="task-manager.html">Task Manager</a></li>
          <li><i class="fa-solid fa-pen-to-square"></i><a href="task-script.html">Task Script</a></li>
          <li><i class="fa-solid fa-gear"></i><a href="settings.html">Settings</a></li>
          <li><i class="fa-solid fa-info-circle"></i><a href="about.html">About</a></li>
          <button id="logout">Logout</button>
        </ul>
      </div>
    </div>
  </div>
  <!-- HEADER -->

  <header>
    <h2>Task Script</h2>
    <p>Write and sketch your tasks systematically</p>
  </header>


  <main class="script-main">

    <div class="writing-box">
      <div class="script-head">
        <h2>Task Script Pad</h2>
        <small>Write a detailed blueprint for your task</small>
      </div>
      <div class="script-box-outer">
        <div class="scripting-box">
          <div>
            <div class="script-body">
              <form id="script-form">
                <div id="cancel-script" title="Cancel">
                  <i class="fa-solid fa-xmark"></i>
                </div>
                <div>
                  <label for="script-name">Script Name<sup style="color: red; font-weight: 400;">*</sup></label>
                  <input id="script-name" type="text" placeholder="Give a name for your script." required>
                </div>

                <div>
                  <label for="task-name">For what task?<sup style="color: red; font-weight: 400;">*</sup></label>
                  <input id="filter-input" type="text" placeholder="Filter by task name...">
                  <select id="filter-category">
                    <option value="task">Task</option>
                    <option value="priority">Priority</option>
                    <option value="date">Date</option>
                  </select>

                  <div class="task-choice-container">
                    <div class="tasks">
                      <div id="desired-task">
                      </div>
                    </div>
                  </div>
                </div>


                <div>
                  <label for="start-date">Date of starting<sup style="color: red; font-weight: 400;">*</sup></label>
                  <input id="start-date" type="date" placeholder="Date of starting" required>
                </div>

                <div>
                  <label for="end-date">End Date (if you've planed)</label>
                  <input id="end-date" type="date" placeholder="Date of completion">
                </div>

                <div>
                  <label for="goal">Goal / Target<sup style="color: red; font-weight: 400;">*</sup></label>
                  <input id="goal" type="text" placeholder="What's your target" required>
                </div>

                <div>
                  <label for="script">Script</label>
                  <textarea id="script" placeholder="Write a detailed script here"></textarea>
                </div>

                <div class="upload-section">
                  <p>Or</p>
                  <p>Upload a txt/docx/pdf file instead that you already have</p>

                  <button type="button" id="txtbtn">Upload File</button>

<input
    type="file"
    id="script-file"
    accept=".txt,.docx,.pdf"
    hidden
>

<small id="file-name"></small>

                  <button type="submit" id="save-script"
                    style="background-color: hwb(173 0% 16%); text-shadow: 0px 0px 5px black;">
                    Save Script
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="add-script" class="new-script" title="Write new script for a task">
      <i id="file-icon" class="fa-regular fa-file"></i>
      <i id="plus-icon" class="fa-regular fa-plus"></i>
    </div>
  </main>


  <script type="module" src="js/auth.js"></script>

  <script type="module" src="js/main.js"></script>

</body>

</html>
